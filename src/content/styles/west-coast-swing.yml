name: West Coast Swing
order: 30
summary: A smooth, stretchy partner dance done in a narrow "slot." It fits modern pop, blues and R&B as well as classic swing.
description: West Coast Swing is danced in a straight line, or slot, with a smooth, elastic feel. Guest teachers lead West Coast Swing lessons on some Tuesdays.
tempo: Slow to medium blues, R&B, pop and swing
family: swing
