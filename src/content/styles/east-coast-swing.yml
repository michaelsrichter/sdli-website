name: East Coast Swing
order: 10
summary: A bouncy, beginner-friendly swing dance built on simple six-count patterns. It is the style most often taught in our beginner lessons.
description: East Coast Swing grew out of Lindy Hop in the 1940s as an easier, more compact way to swing dance. If you can walk to the beat, you can learn your first East Coast Swing moves in one lesson.
tempo: Medium to fast swing, rock and roll, and jump blues
