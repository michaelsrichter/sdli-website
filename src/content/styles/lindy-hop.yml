name: Lindy Hop
order: 20
summary: The original swing dance from 1920s and 1930s Harlem. Playful and energetic, with both six-count and eight-count patterns, including the famous swingout.
description: Lindy Hop was born in the ballrooms of Harlem, New York, during the Jazz Age. Our dancers enjoy Savoy-style and Hollywood-style Lindy, along with related dances such as Charleston.
tempo: Big-band swing and hot jazz
family: swing
