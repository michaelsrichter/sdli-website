title: Swing style at other dances
description: Dressing up is optional, but fun. Many swing dancers enjoy vintage-inspired outfits, and comfortable clothes are just as welcome. These photos are from the 2018 Lindy Bout swing dance competition in Vancouver, Canada, shown for inspiration. They are not SDLI events.
order: 40
published: true
homepageSlideshow: false
source: Wikimedia Commons, photos by Thomas Quine, CC BY 2.0.
rightsNote: Free to use with credit (CC BY 2.0). Keep the photographer credit and license link with each photo.

