title: Tuesday nights at the Moose Lodge
description: Recent SDLI dances at the Huntington Moose Lodge in Greenlawn, from band nights to holiday parties.
order: 5
published: true
homepageSlideshow: true
source: Photos and videos shared by SDLI members in the SDLI Facebook group and by the Huntington Moose Lodge, provided to the website by the site owner (October 2026).
rightsNote: Before launch, confirm each photographer's permission and add a credit line. Remove any photo if someone in it asks.

