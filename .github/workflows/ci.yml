name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A fixed "now" makes end-to-end results repeatable. Deployment builds use the real time.
  BUILD_NOW: '2026-10-01T22:00:00-04:00'
  SITE_URL: https://www.sdli.org
  ALLOW_INDEXING: 'true'

jobs:
  quality:
    name: Type check, tests, build, links
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install site dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Validate content and types (astro check)
        run: npm run check
      - name: Unit tests (schemas, events, timezones, calendars, SEO, redirects, CMS config)
        run: npm test
      - name: API tests (OAuth bridge, telemetry validation, rate limiting)
        run: npm test --prefix api

      - name: Build
        run: npm run build
      - name: Unit tests against the built site (legacy redirects)
        run: npm test -- tests/unit/seo-config.test.ts
      - name: Check internal links and #anchors
        run: npm run test:links

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end, accessibility (axe) and mobile tests
        run: npm run test:e2e
      - name: Lighthouse quality gates
        run: npx lhci autorun

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
